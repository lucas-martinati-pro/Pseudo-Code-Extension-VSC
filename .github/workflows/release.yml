name: Release Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de version (ex: v0.4.2) - optionnel si vide, prend la version du package.json'
        required: false
        type: string
      draft:
        description: 'Créer en tant que brouillon (Draft)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile and package extension
        run: npx @vscode/vsce package

      - name: Determine tag name
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "TAG_NAME=${{ github.event.inputs.tag_name }}" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "TAG_NAME=v$VERSION" >> $GITHUB_ENV
          fi

      - name: Prepare Release Notes
        run: |
          node -e "
            const fs = require('fs');
            const releaseFile = ['RELEASE_NOTES.md'].find(f => fs.existsSync(f));
            if (releaseFile) {
              const content = fs.readFileSync(releaseFile, 'utf8');
              const tagName = process.env.TAG_NAME || '';
              const version = tagName.replace(/^v/, '');
              const sections = content.split(/\n(?=# 🚀 Release)/);
              let matched = null;
              if (version) {
                matched = sections.find(s => s.includes(version));
              }
              const note = (matched || sections[0] || content).trim();
              fs.writeFileSync('release_notes.md', note, 'utf8');
              console.log('Notes de version extraites depuis ' + releaseFile + ' pour ' + (tagName || 'la version la plus récente'));
              fs.appendFileSync(process.env.GITHUB_ENV, 'HAS_BODY=true\n');
            } else {
              console.log('Aucun fichier RELEASE_NOTES.md trouvé.');
              fs.appendFileSync(process.env.GITHUB_ENV, 'HAS_BODY=false\n');
            }
          "

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          body_path: ${{ env.HAS_BODY == 'true' && 'release_notes.md' || '' }}
          generate_release_notes: true
          draft: ${{ github.event.inputs.draft || false }}
          files: "*.vsix"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx @vscode/vsce publish --packagePath *.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx ovsx publish *.vsix -p ${{ secrets.OVSX_PAT }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
