name: Release Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de version (ex: v0.3.0) - optionnel si vide, prend la version du package.json'
        required: false
        type: string
      description:
        description: 'Description personnalisée de la release (supporte le Markdown et les retours à la ligne)'
        required: false
        type: string
      draft:
        description: 'Créer en tant que brouillon (Draft)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile and package extension
        run: npx @vscode/vsce package

      - name: Determine tag name
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "TAG_NAME=${{ github.event.inputs.tag_name }}" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "TAG_NAME=v$VERSION" >> $GITHUB_ENV
          fi

      - name: Prepare Release Notes
        env:
          INPUT_DESC: ${{ github.event.inputs.description }}
        run: |
          if [ -n "$INPUT_DESC" ]; then
            # Préserve les retours à la ligne réels et convertit les \n textuels
            printf "%b\n" "$INPUT_DESC" > release_notes.md
            echo "HAS_BODY=true" >> $GITHUB_ENV
          elif [ -f "RELEASE_NOTES.md" ]; then
            cp RELEASE_NOTES.md release_notes.md
            echo "HAS_BODY=true" >> $GITHUB_ENV
          else
            echo "HAS_BODY=false" >> $GITHUB_ENV
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          body_path: ${{ env.HAS_BODY == 'true' && 'release_notes.md' || '' }}
          generate_release_notes: true
          draft: ${{ github.event.inputs.draft || false }}
          files: "*.vsix"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
